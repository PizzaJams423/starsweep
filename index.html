<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Star Sweep Trial</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 40%,#101b3f 0%,#060816 55%,#02030a 100%);font-family:system-ui,Arial,sans-serif;color:#e8f7ff}
  canvas{display:block;width:100vw;height:100vh}
  .hud{position:fixed;inset:0;pointer-events:none}
  .panel{position:absolute;background:rgba(8,12,28,.72);border:1px solid rgba(95,109,180,.7);border-radius:16px;backdrop-filter:blur(6px);box-shadow:0 10px 30px rgba(0,0,0,.28);padding:10px 12px}
  .top{left:12px;top:12px;display:flex;gap:10px;align-items:center}
  .bottom{left:12px;bottom:12px;max-width:min(520px,calc(100vw - 24px));font-size:13px;line-height:1.35}
  .right{right:12px;top:12px;text-align:right}
  .pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#1f2a52;font-size:12px;font-weight:700}
  .big{font-size:18px;font-weight:900}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="panel top"><span class="pill">Trial Build</span><span class="big">Star Sweep</span></div>
  <div class="panel right"><div>Score: <span id="score">0</span></div><div>Ammo: <span id="ammo">30</span></div><div>Shields: <span id="shields">0</span></div></div>
  <div class="panel bottom">Desktop: click/tap to fire. Targets spawn from screen edges and exit on the opposite side. Bullet contact removes the shot immediately. Ammo hitting zero ends the run.</div>
</div>
<script>
const c = document.getElementById('game');
const x = c.getContext('2d');
const scoreEl = document.getElementById('score');
const ammoEl = document.getElementById('ammo');
const shieldsEl = document.getElementById('shields');

let W = innerWidth;
let H = innerHeight;
let score = 0;
let ammo = 30;
let shootCooldown = 0;
let spawnTimer = 0;
let gameOver = false;
let last = performance.now();

const bullets = [];
const targets = [];

function resize() {
  W = innerWidth;
  H = innerHeight;
  c.width = W;
  c.height = H;
}

function rand(a, b) {
  return a + Math.random() * (b - a);
}

function clamp(v, a, b) {
  return Math.max(a, Math.min(b, v));
}

function spawnTarget() {
  const defs = [
    { type: 'asteroid', r: 20, hp: 1, speed: 1.15, color: '#9aa3b2', ammo: 0, shieldChance: 0.12 },
    { type: 'drone', r: 14, hp: 2, speed: 1.7, color: '#6ee7ff', ammo: 1, shieldChance: 0.20 },
    { type: 'fighter', r: 16, hp: 3, speed: 2.2, color: '#f59e0b', ammo: 1, shieldChance: 0.28 },
    { type: 'ufo', r: 18, hp: 4, speed: 1.35, color: '#a78bfa', ammo: 5, shieldChance: 0.35 }
  ];

  const t = defs[Math.floor(Math.random() * defs.length)];
  const side = Math.floor(rand(0, 4));
  const pad = t.r + 18;
  let x0, y0, vx, vy;

  if (side === 0) { x0 = rand(pad, W - pad); y0 = -pad; vx = rand(-0.25, 0.25); vy = t.speed; }
  if (side === 1) { x0 = W + pad; y0 = rand(pad, H - pad); vx = -t.speed; vy = rand(-0.25, 0.25); }
  if (side === 2) { x0 = rand(pad, W - pad); y0 = H + pad; vx = rand(-0.25, 0.25); vy = -t.speed; }
  if (side === 3) { x0 = -pad; y0 = rand(pad, H - pad); vx = t.speed; vy = rand(-0.25, 0.25); }

  if (t.type === 'drone') { vy += rand(-0.6, 0.6); }
  if (t.type === 'fighter') { vx *= 1.4; vy *= 0.5; }
  if (t.type === 'ufo') { vx *= 0.7; vy *= 0.7; }

  targets.push({
    type: t.type,
    x: x0,
    y: y0,
    vx,
    vy,
    r: t.r,
    hp: t.hp,
    maxHp: t.hp,
    color: t.color,
    ammoReward: t.ammo,
    hasShield: Math.random() < t.shieldChance,
    shieldReward: 5,
    phase: rand(0, Math.PI * 2),
    spin: rand(-0.08, 0.08),
    scale: 0.25
  });
}

function fire(tx, ty) {
  if (gameOver || shootCooldown > 0 || ammo <= 0) return;
  const px = W / 2;
  const py = H * 0.83;
  const dx = tx - px;
  const dy = ty - py;
  const d = Math.hypot(dx, dy) || 1;
  bullets.push({ x: px, y: py, vx: dx / d * 9, vy: dy / d * 9, life: 70, r: 4 });
  ammo--;
  shootCooldown = 8;
  if (ammo <= 0) gameOver = true;
}

function drawShip() {
  const px = W / 2;
  const py = H * 0.83;
  x.save();
  x.translate(px, py);
  x.fillStyle = '#7dd3fc';
  x.beginPath();
  x.moveTo(0, -18);
  x.lineTo(11, 14);
  x.lineTo(0, 8);
  x.lineTo(-11, 14);
  x.closePath();
  x.fill();
  x.fillStyle = '#1f2937';
  x.fillRect(-6, 2, 12, 16);
  x.restore();
}

function drawTarget(o) {
  x.save();
  x.translate(o.x, o.y);
  x.rotate(o.phase);
  x.scale(o.scale, o.scale);
  x.fillStyle = o.color;

  if (o.type === 'asteroid') {
    x.beginPath();
    for (let i = 0; i < 7; i++) {
      const a = i / 7 * Math.PI * 2;
      const rr = 18 + (i % 2) * 5;
      x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    x.closePath();
    x.fill();
  } else if (o.type === 'drone') {
    x.beginPath();
    x.roundRect(-12, -8, 24, 16, 6);
    x.fill();
    x.fillStyle = '#0f172a';
    x.fillRect(-4, -14, 8, 8);
    x.fillStyle = o.color;
    x.fillRect(-18, -3, 6, 6);
    x.fillRect(12, -3, 6, 6);
  } else if (o.type === 'fighter') {
    x.beginPath();
    x.moveTo(0, -16);
    x.lineTo(14, 10);
    x.lineTo(0, 6);
    x.lineTo(-14, 10);
    x.closePath();
    x.fill();
    x.fillStyle = '#0f172a';
    x.fillRect(-4, -2, 8, 12);
  } else {
    x.beginPath();
    x.ellipse(0, 0, 18, 10, 0, 0, Math.PI * 2);
    x.fill();
    x.fillStyle = '#c4b5fd';
    x.beginPath();
    x.ellipse(0, 0, 10, 5, 0, 0, Math.PI * 2);
    x.fill();
  }

  x.restore();

  x.fillStyle = 'rgba(255,255,255,.12)';
  x.fillRect(o.x - o.r, o.y - o.r - 8, o.r * 2, 4);
  x.fillStyle = '#22c55e';
  x.fillRect(o.x - o.r, o.y - o.r - 8, (o.r * 2) * (o.hp / o.maxHp), 4);
  if (o.hasShield) {
    x.strokeStyle = 'rgba(125, 211, 252, .95)';
    x.lineWidth = 2;
    x.beginPath();
    x.arc(o.x, o.y, o.r + 6, 0, Math.PI * 2);
    x.stroke();
  }
}

function updateTargets(dt) {
  for (let i = targets.length - 1; i >= 0; i--) {
    const o = targets[i];
    o.phase += o.spin * dt;
    o.scale = Math.min(1, o.scale + 0.02 * dt);

    if (o.type === 'asteroid') {
      o.x += o.vx * dt;
      o.y += o.vy * dt;
    } else if (o.type === 'drone') {
      o.x += o.vx * dt;
      o.y += Math.sin(o.phase + o.x * 0.02) * 1.2 * dt;
    } else if (o.type === 'fighter') {
      o.x += o.vx * dt;
      o.y += Math.sin(o.phase * 2.2) * 0.9 * dt;
    } else if (o.type === 'ufo') {
      o.x += o.vx * dt;
      o.y += Math.sin(o.phase * 0.8) * 0.55 * dt;
    }

    const pad = o.r + 24;
    if (o.x < -pad || o.x > W + pad || o.y < -pad || o.y > H + pad) {
      targets.splice(i, 1);
      continue;
    }

    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.hypot(b.x - o.x, b.y - o.y) < o.r + b.r) {
        bullets.splice(j, 1);
        o.hp--;
        o.scale = 1.15;
        if (o.hp <= 0) {
          score += 10;
          ammo += o.ammoReward || 0;
          if (o.hasShield) ammo += 5;
          targets.splice(i, 1);
        }
        break;
      }
    }
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0 || b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) bullets.splice(i, 1);
  }
}

function loop(now) {
  const dt = Math.min(2, (now - last) / 16.67);
  last = now;
  x.clearRect(0, 0, W, H);

  x.fillStyle = 'rgba(255,255,255,.05)';
  for (let i = 0; i < 70; i++) {
    const sx = (i * 97) % W;
    const sy = (i * 193 + now * 0.02) % H;
    x.fillRect(sx, sy, 2, 2);
  }

  if (!gameOver) {
    if (shootCooldown > 0) shootCooldown--;

    spawnTimer += dt;
    if (targets.length < 8 && spawnTimer > 14) {
      spawnTimer = 0;
      spawnTarget();
    }

    updateBullets(dt);
    updateTargets(dt);

    ammoEl.textContent = ammo;
    scoreEl.textContent = score;
    shieldsEl.textContent = targets.filter(t => t.hasShield).length;

    if (ammo <= 0) gameOver = true;
  }

  drawShip();
  bullets.forEach(b => {
    x.fillStyle = '#f8fafc';
    x.beginPath();
    x.arc(b.x, b.y, 4, 0, Math.PI * 2);
    x.fill();
  });
  targets.forEach(drawTarget);

  if (gameOver) {
    x.fillStyle = 'rgba(0,0,0,.45)';
    x.fillRect(0, 0, W, H);
    x.fillStyle = '#fff';
    x.font = 'bold 42px system-ui';
    x.textAlign = 'center';
    x.fillText('Game Over', W / 2, H / 2);
  }

  requestAnimationFrame(loop);
}

addEventListener('resize', resize);
addEventListener('pointerdown', e => fire(e.clientX, e.clientY));
resize();
for (let i = 0; i < 6; i++) spawnTarget();
requestAnimationFrame(loop);
</script>
</body>
</html>
